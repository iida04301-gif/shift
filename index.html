<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>シフト管理</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0EA; --surface:#FFFFFF; --ink:#263029; --muted:#8B8578;
    --primary:#3E6259; --primary-soft:#DCE6DF; --primary-dark:#2B4A42;
    --saturday:#E3EAF3; --saturday-ink:#3E5A82;
    --sunday:#F5E1E0; --sunday-ink:#9C4A42;
    --border:#DCD6C9; --warning:#C0473A; --warning-bg:#FBE4E1;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Noto Sans JP', sans-serif; -webkit-font-smoothing:antialiased; }
  .heading-font{ font-family:'Zen Maru Gothic', 'Noto Sans JP', sans-serif; }
  .app{ max-width:1400px; margin:0 auto; padding:14px 10px 40px; }

  .topbar{ display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:10px; margin-bottom:12px; }
  .brand{ display:flex; align-items:baseline; gap:8px; }
  .brand .leaf{ font-size:20px; }
  .brand h1{ font-family:'Zen Maru Gothic', sans-serif; font-size:16px; font-weight:700; color:var(--primary-dark); margin:0; }
  .brand .sub{ font-size:11px; color:var(--muted); }

  .month-nav{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:4px 4px; }
  .month-nav button{ width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--primary-dark); font-size:15px; cursor:pointer; }
  .month-nav button:hover{ background:var(--primary-soft); }
  .month-nav .label{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:13.5px; min-width:76px; text-align:center; }

  .role-area{ display:flex; align-items:center; gap:8px; }
  .role-select{ font-family:inherit; border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:6px 8px; font-size:12px; }
  .admin-pill{ font-size:10.5px; padding:3px 9px; border-radius:999px; background:var(--primary); color:#fff; display:none; }
  .admin-pill.show{ display:inline-block; }

  .tabs{ display:flex; gap:6px; margin-bottom:10px; }
  .tabs button{ flex:1; border:1px solid var(--border); background:var(--surface); color:var(--muted); padding:9px 8px; font-size:12.5px; border-radius:8px; cursor:pointer; font-family:inherit; font-weight:500; }
  .tabs button.active{ background:var(--primary); border-color:var(--primary); color:#fff; }

  .lock-note{ font-size:12px; color:var(--warning); background:var(--warning-bg); border:1px solid #ecc7c1; border-radius:8px; padding:7px 10px; margin-bottom:10px; display:none; gap:6px; }
  .lock-note.show{ display:flex; }

  .legend{ display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px; font-size:10.5px; color:var(--muted); }
  .legend span{ display:inline-flex; align-items:center; gap:4px; }
  .swatch{ width:10px; height:10px; border-radius:3px; display:inline-block; border:1px solid rgba(0,0,0,.06); }

  /* ---------- table ---------- */
  .table-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; max-width:100%; max-height:72vh; }
  table{ border-collapse:separate; border-spacing:0; width:max-content; min-width:100%; }
  th, td{ border-bottom:1px solid var(--border); border-right:1px solid var(--border); white-space:nowrap; }

  thead th{ position:sticky; top:0; z-index:6; background:var(--primary-soft); padding:6px 3px; text-align:center; font-weight:700; font-size:11.5px; color:var(--primary-dark); }
  thead th.frozen{ z-index:8; left:0; }
  thead th .staff-head{ display:flex; flex-direction:column; align-items:center; gap:2px; }
  thead th .gear{ border:none; background:none; color:var(--primary-dark); opacity:.6; font-size:11px; cursor:pointer; padding:0; }
  thead th .del-staff{ border:none; background:none; color:var(--primary-dark); opacity:.5; font-size:10px; cursor:pointer; padding:0; }
  thead th .gear:hover, thead th .del-staff:hover{ opacity:1; color:var(--warning); }

  tbody td.frozen, tbody th.frozen{ position:sticky; left:0; z-index:2; background:var(--surface); }
  tbody tr.sat td, tbody tr.sat th{ background:var(--saturday); }
  tbody tr.sun td, tbody tr.sun th{ background:var(--sunday); }

  .col-date{ text-align:left; padding:6px 8px; min-width:74px; max-width:74px; }
  .col-date .dline{ font-size:12px; font-weight:700; display:flex; align-items:center; gap:2px; }
  .col-date .dow-tag{ font-size:9.5px; color:var(--muted); font-weight:500; }
  tr.sat .col-date .dow-tag{ color:var(--saturday-ink); }
  tr.sun .col-date .dow-tag{ color:var(--sunday-ink); }
  .col-date .total-num{ font-size:15px; font-weight:700; line-height:1.15; }
  .col-date .total-num.warn{ color:var(--warning); }
  .col-date .breakdown{ font-size:8.5px; color:var(--muted); white-space:nowrap; }
  .holiday-toggle{ border:none; background:none; font-size:8.5px; color:var(--sunday-ink); cursor:pointer; padding:0 2px; border-radius:4px; }
  .holiday-toggle.active{ background:var(--sunday-ink); color:#fff; }
  .holiday-toggle:disabled{ opacity:.35; cursor:default; }

  td.cell{ padding:2px; text-align:center; min-width:56px; }
  td.cell .shift-btn{
    width:100%; border:1px solid transparent; background:transparent; border-radius:6px;
    padding:7px 2px; font-size:11px; font-family:inherit; cursor:pointer; color:var(--ink);
  }
  td.cell .shift-btn:hover{ background:var(--primary-soft); }
  td.cell .shift-btn:disabled{ opacity:.55; cursor:default; }
  td.cell .shift-btn.early{ color:var(--primary-dark); font-weight:700; }
  td.cell .shift-btn.late{ color:var(--warning); font-weight:700; }
  td.cell .shift-btn.mid{ color:var(--ink); font-weight:500; }
  td.cell .shift-btn.off{ color:var(--muted); }

  .add-staff-row{ margin-top:12px; display:flex; gap:8px; }
  .add-staff-row input{ flex:1; max-width:220px; border:1px solid var(--border); border-radius:8px; padding:8px 10px; font-size:13px; font-family:inherit; background:var(--surface); color:var(--ink); }
  .add-staff-row button{ border:none; background:var(--primary); color:#fff; border-radius:8px; padding:8px 16px; font-size:13px; cursor:pointer; font-family:inherit; }
  .add-staff-row button:hover{ background:var(--primary-dark); }
  .hint{ font-size:11px; color:var(--muted); margin-top:8px; line-height:1.5; }
  .loading{ padding:40px; text-align:center; color:var(--muted); font-size:13px; }
  .access-gate{ min-height:80vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .access-gate-card{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:32px 24px; max-width:340px; width:100%; text-align:center; }
  .access-gate-card h2{ font-family:'Zen Maru Gothic', sans-serif; font-size:16px; color:var(--primary-dark); margin:10px 0 4px; }
  .access-gate-card input{ width:100%; border:1px solid var(--border); border-radius:10px; padding:12px; font-size:18px; text-align:center; letter-spacing:2px; font-family:inherit; }
  .gate-error{ color:var(--warning); font-size:12px; min-height:16px; margin-top:8px; }

  /* ---------- timeline ---------- */
  .day-nav{ display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:10px; background:var(--surface); border:1px solid var(--border); border-radius:999px; padding:5px; }
  .day-nav button{ width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--primary-dark); font-size:15px; cursor:pointer; }
  .day-nav button:hover{ background:var(--primary-soft); }
  .day-nav .label{ font-family:'Zen Maru Gothic', sans-serif; font-weight:700; font-size:13.5px; min-width:130px; text-align:center; }

  .timeline-wrap{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); overflow:auto; padding:10px 8px 14px; }
  .tl-empty{ padding:24px; text-align:center; color:var(--muted); font-size:13px; }
  .tl-row{ display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .tl-name{ min-width:58px; max-width:58px; font-size:11px; text-align:right; padding-right:4px; flex-shrink:0; }
  .tl-track{ position:relative; flex:1; height:22px; background:repeating-linear-gradient(to right, transparent, transparent calc(100%/14 - 1px), var(--border) calc(100%/14 - 1px), var(--border) calc(100%/14)); border-radius:5px; min-width:600px; }
  .tl-bar{ position:absolute; top:2px; height:18px; border-radius:5px; font-size:9.5px; color:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden; padding:0 3px; }
  .tl-bar.early{ background:var(--primary-dark); }
  .tl-bar.mid{ background:var(--primary); }
  .tl-bar.late{ background:var(--warning); background-image:repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px); }
  .tl-axis{ display:flex; margin-left:64px; min-width:600px; }
  .tl-axis span{ flex:1; font-size:9.5px; color:var(--muted); text-align:left; }
  .tl-cover-wrap{ display:flex; align-items:flex-end; gap:1px; margin-left:64px; height:46px; min-width:600px; margin-top:10px; border-top:1px dashed var(--border); padding-top:4px;}
  .tl-cover-bar{ flex:1; background:var(--primary-soft); border-radius:2px 2px 0 0; position:relative; }
  .tl-cover-bar.low{ background:var(--warning-bg); }
  .tl-cover-label{ font-size:8px; color:var(--muted); text-align:center; margin-left:64px; margin-top:2px; }

  /* ---------- modal ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(38,48,41,.42); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
  .modal-panel{ background:var(--surface); width:100%; max-width:420px; border-radius:16px 16px 0 0; padding:18px 18px 22px; }
  .modal-panel h3{ margin:0 0 4px; font-family:'Zen Maru Gothic', sans-serif; font-size:15px; color:var(--primary-dark); }
  .modal-panel .modal-sub{ font-size:11.5px; color:var(--muted); margin-bottom:14px; }
  .modal-row{ display:flex; gap:10px; margin-bottom:12px; }
  .modal-field{ flex:1; }
  .modal-field label{ display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  .modal-field select{ width:100%; border:1px solid var(--border); border-radius:8px; padding:9px 6px; font-size:14px; font-family:inherit; background:var(--surface); color:var(--ink); }
  .modal-check{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--ink); margin:10px 0 16px; }
  .modal-actions{ display:flex; gap:8px; }
  .modal-actions button{ flex:1; border:none; border-radius:9px; padding:11px; font-size:13.5px; font-family:inherit; cursor:pointer; }
  .btn-primary{ background:var(--primary); color:#fff; }
  .btn-primary:hover{ background:var(--primary-dark); }
  .btn-off{ background:var(--warning-bg); color:var(--warning); }
  .btn-cancel{ background:#EFEDE6; color:var(--muted); }

  .weekday-modal .wd-row{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
  .weekday-modal .wd-label{ width:34px; font-size:12.5px; font-weight:700; flex-shrink:0; }
  .weekday-modal select{ border:1px solid var(--border); border-radius:7px; padding:6px 4px; font-size:12.5px; font-family:inherit; background:var(--surface); color:var(--ink); }

  .staff-mgmt-list{ max-height:38vh; overflow:auto; border:1px solid var(--border); border-radius:8px; }
  .staff-mgmt-row{ display:flex; align-items:center; gap:8px; padding:8px 10px; border-bottom:1px solid var(--border); }
  .staff-mgmt-row:last-child{ border-bottom:none; }
  .sm-name{ flex:1; font-size:13px; font-weight:500; }
  .sm-gender{ font-size:11px; color:var(--muted); background:var(--bg); padding:2px 8px; border-radius:999px; }
  .sm-del{ border:1px solid var(--warning); background:var(--warning-bg); color:var(--warning); border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .sm-gender-select{ border:1px solid var(--border); border-radius:7px; padding:4px 6px; font-size:11.5px; font-family:inherit; background:var(--surface); color:var(--ink); }
  .gender-dot{ display:inline-block; width:9px; height:9px; border-radius:50%; flex-shrink:0; background:var(--border); }
  .gender-dot.male{ background:#3E6BAE; }
  .gender-dot.female{ background:#C0473A; }
  .sm-retire{ border:1px solid var(--border); background:var(--bg); color:var(--muted); border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .sm-retire:hover{ background:var(--warning-bg); color:var(--warning); border-color:#ecc7c1; }
  .sm-reactivate{ border:1px solid var(--primary); background:var(--primary-soft); color:var(--primary-dark); border-radius:7px; padding:5px 10px; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .sm-order{ display:flex; flex-direction:column; gap:1px; }
  .sm-move{ border:1px solid var(--border); background:var(--surface); color:var(--primary-dark); border-radius:5px; width:20px; height:16px; font-size:9px; line-height:1; cursor:pointer; padding:0; }
  .sm-move:disabled{ opacity:.3; cursor:default; }
  .sm-del:hover{ background:var(--warning); color:#fff; }
  .month-nav-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .print-btn{ border:1px solid var(--border); background:var(--surface); color:var(--primary-dark); border-radius:999px; padding:7px 14px; font-size:12px; cursor:pointer; font-family:inherit; margin-bottom:10px; }
  .print-btn:hover{ background:var(--primary-soft); }
  .print-title{ display:none; }

  @page{ size: A3 landscape; margin: 6mm; }
  @media print{
    #modalOverlay{ display:none !important; }
    body{ background:#fff; }
    .app{ max-width:none; padding:0; margin:0; }
    .topbar, .tabs, .legend, .lock-note, .add-staff-row, .hint, .month-nav, .print-btn, .role-area{ display:none !important; }
    .print-title{
      display:block; font-family:'Zen Maru Gothic', sans-serif; font-weight:700;
      font-size:11pt; color:#000; margin:0 0 1.5mm; text-align:center; line-height:1;
    }
    .table-wrap{ border:none; overflow:visible; max-height:none; border-radius:0; }
    table{ width:100%; table-layout:fixed; border-collapse:collapse; }
    tr{ page-break-inside:avoid; }
    thead{ display:table-header-group; }
    thead th{ position:static; background:#eee !important; color:#000 !important; font-size:9pt; line-height:1.1; padding:1mm 0.5mm; border:0.5pt solid #999; }
    thead th .gear, thead th .del-staff{ display:none !important; }
    tbody td.frozen, tbody th.frozen, thead th.frozen{ position:static !important; left:auto !important; }
    tbody tr.sat td, tbody tr.sat th{ background:#eef2f8 !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    tbody tr.sun td, tbody tr.sun th{ background:#fbeceb !important; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    th, td{ border:0.5pt solid #999 !important; }
    .col-date{ min-width:0; max-width:none; padding:0.8mm 1.5mm; white-space:nowrap; line-height:1.1; }
    .col-date .dline{ display:inline; font-size:9pt; font-weight:700; color:#000; }
    .col-date .breakdown{ display:none; }
    .holiday-toggle{ display:none !important; }
    .total-num{ display:inline; font-size:9pt !important; color:#000 !important; margin-left:2mm; }
    .total-num.warn{ color:#c0473a !important; font-weight:700; }
    td.cell{ padding:0.3mm; }
    td.cell .shift-btn{ font-size:12pt !important; font-weight:800 !important; line-height:1.1; color:#000 !important; padding:1mm 0; }
    td.cell .shift-btn.late{ color:#a8342a !important; }
    td.cell .shift-btn.off{ color:#bbb !important; font-weight:400 !important; }
  }
</style>
</head>

<script>
/* ---------------- Japanese public holiday calculation (approximate, 2000-2099) ---------------- */
function nthMonday(year, month, n){
  let count = 0;
  for(let day=1; day<=31; day++){
    const dt = new Date(year, month-1, day);
    if(dt.getMonth() !== month-1) break;
    if(dt.getDay() === 1){ count++; if(count===n) return day; }
  }
  return null;
}
function vernalEquinoxDay(year){ return Math.floor(20.8431 + 0.242194*(year-1980) - Math.floor((year-1980)/4)); }
function autumnalEquinoxDay(year){ return Math.floor(23.2488 + 0.242194*(year-1980) - Math.floor((year-1980)/4)); }
function computeHolidays(year){
  const map = {};
  const add = (m,d,name) => { map[String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0')] = name; };
  add(1,1,'元日');
  const comingOfAge = nthMonday(year,1,2); if(comingOfAge) add(1,comingOfAge,'成人の日');
  add(2,11,'建国記念の日');
  if(year>=2020) add(2,23,'天皇誕生日'); else add(12,23,'天皇誕生日');
  add(3, vernalEquinoxDay(year), '春分の日');
  add(4,29,'昭和の日');
  add(5,3,'憲法記念日'); add(5,4,'みどりの日'); add(5,5,'こどもの日');
  if(year>=2003){ const marine = nthMonday(year,7,3); if(marine) add(7,marine,'海の日'); } else add(7,20,'海の日');
  if(year>=2016) add(8,11,'山の日');
  const respect = nthMonday(year,9,3); if(respect) add(9,respect,'敬老の日');
  add(9, autumnalEquinoxDay(year), '秋分の日');
  if(year>=2020){ const sports = nthMonday(year,10,2); if(sports) add(10,sports,'スポーツの日'); }
  else { const taiiku = nthMonday(year,10,2); if(taiiku) add(10,taiiku,'体育の日'); }
  add(11,3,'文化の日'); add(11,23,'勤労感謝の日');
  const entries = Object.keys(map).map(k=>{ const [m,d]=k.split('-').map(Number); return {m,d,date:new Date(year,m-1,d)}; });
  entries.forEach(e=>{
    if(e.date.getDay()===0){
      let next = new Date(e.date); next.setDate(next.getDate()+1);
      let key = String(next.getMonth()+1).padStart(2,'0')+'-'+String(next.getDate()).padStart(2,'0');
      while(map[key]){ next.setDate(next.getDate()+1); key = String(next.getMonth()+1).padStart(2,'0')+'-'+String(next.getDate()).padStart(2,'0'); }
      map[key] = '振替休日';
    }
  });
  // 国民の休日: 前日と翌日がどちらも祝日になっている平日（日曜は除く）は休日になる
  // 例: 2026年9月22日（敬老の日 9/21 と 秋分の日 9/23 に挟まれる）
  const keyOf = (dt) => String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
  Object.keys(map).forEach(k=>{
    const [m,d] = k.split('-').map(Number);
    const mid = new Date(year, m-1, d+1);
    const after = new Date(year, m-1, d+2);
    if(mid.getFullYear()===year && after.getFullYear()===year && map[keyOf(after)] && !map[keyOf(mid)] && mid.getDay()!==0){
      map[keyOf(mid)] = '国民の休日';
    }
  });
  return map;
}
const holidayCache = {};
function isNationalHoliday(year, month, day){
  if(!holidayCache[year]) holidayCache[year] = computeHolidays(year);
  const key = String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
  return holidayCache[year][key] || null;
}

/* ---------------- 保存先の設定 ---------------- */
// ★ Google Apps Script の「ウェブアプリのURL」をここに貼り付けると、全員が同じ設定で使えます。
//    （空のままでも、最初に開いたときの設定画面から入力できます）
const API_URL = 'https://script.google.com/macros/s/AKfycbyCf04dOwR4cHJnSAmn7V4fgZ25tXTr-gZSTJpHqqnzqly8Qfin1aBkaUcqHCFdM54C/exec';

/* ---------------- この端末だけに保存するもの（コード・役割など） ---------------- */
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); return true; }catch(e){ return false; } }
function lsRemove(k){ try{ localStorage.removeItem(k); }catch(e){} }

function getApiUrl(){ return API_URL || lsGet('shift-api-url') || ''; }
function getStoredCode(){ return lsGet('shift-access-code') || ''; }
function getAdminPw(){ return lsGet('shift-admin-pw') || ''; }

/* ---------------- サーバー(Google スプレッドシート)との通信 ---------------- */
class AuthError extends Error {}     // 入店コードが違う／変更された
class NetworkError extends Error {}  // 通信できなかった（空データとは区別する）

async function api(action, payload){
  const url = getApiUrl();
  if(!url) throw new NetworkError('API URL未設定');
  const body = JSON.stringify({ action, code: getStoredCode(), ...(payload||{}) });
  const ctrl = new AbortController();
  const timer = setTimeout(()=> ctrl.abort(), 30000);
  let data;
  try{
    // Content-Type を指定しない(text/plain)ことで、事前確認(プリフライト)なしで通信できます
    const res = await fetch(url, { method:'POST', body, redirect:'follow', signal: ctrl.signal });
    data = await res.json();
  }catch(e){
    throw new NetworkError(String(e && e.message || e));
  }finally{
    clearTimeout(timer);
  }
  if(data && data.error === 'unauthorized') throw new AuthError();
  return data || { ok:false, error:'empty_response' };
}

/* ---------------- time helpers ---------------- */
function minutesToTime(t){ const hh=Math.floor(t/60), mm=t%60; return hh+':'+(mm===0?'00':String(mm).padStart(2,'0')); }
function timeOptions(startH, endH, stepMin){
  const arr=[];
  for(let t=startH*60; t<=endH*60; t+=stepMin) arr.push(minutesToTime(t));
  return arr;
}
const START_OPTIONS = timeOptions(10,22,30);
const END_TIME_OPTIONS = [...timeOptions(10,25,30), '25:30', '25:40'];
function timeToMinutes(str){
  if(!str || str==='L') return null;
  const [h,m] = str.split(':').map(Number);
  return h*60+m;
}
function shortTime(t){ return t.endsWith(':00') ? t.slice(0, t.indexOf(':')) : t; }

/* ---------------- app state ---------------- */
const today = new Date();
const DEFAULT_STAFF_NAMES = ['三島','飯田','斉藤','松下','占部','大曽根','佐藤','牛原','木村','土屋','山越','小林','中林'];
const WEEKDAY_LABEL = ['日','月','火','水','木','金','土'];
const AXIS_START = 8*60, AXIS_END = 22*60; // timeline display window 8:00-22:00

// 管理者の役割は、この端末に管理者パスワードが保存されているときだけ有効
let state = {
  year: today.getFullYear(), month: today.getMonth()+1,
  role: (lsGet('shift-role') === 'admin' && getAdminPw()) ? 'admin' : 'staff', view: 'table',
  staff: [], shifts: {}, holidays: {},
  settings: { lockDay: 15, monthOverrides: {} },
  timelineDay: today.getDate()
};

function monthKey(y,m){ return y+'-'+String(m).padStart(2,'0'); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function uid(){ return 's'+Math.random().toString(36).slice(2,9); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function monthIndex(y,m){ return y*12 + (m-1); }
function activeStaff(){ return state.staff.filter(s => s.active !== false); }

function classify(shift){
  if(!shift || !shift.start) return 'off';
  if(shift.start==='10:00') return 'early';
  if(shift.end==='L') return 'late';
  return 'mid';
}

// A month is open to non-admin staff by default only if it's the current month
// or the next one — e.g. in September, staff can enter September and October,
// but not November onward, until an admin explicitly opens it early.
function isMonthOpenByDefault(y,m){
  const todayIdx = monthIndex(today.getFullYear(), today.getMonth()+1);
  return monthIndex(y,m) <= todayIdx + 1;
}
function resolveMonthOpen(y,m){
  const ov = state.settings.monthOverrides[monthKey(y,m)];
  if(ov === 'open') return true;
  if(ov === 'closed') return false;
  return isMonthOpenByDefault(y,m);
}
// Returns null (not locked), 'closed' (month not yet opened), or 'daylock'
// (month is open but the configurable lock-day has passed).
function lockReasonForStaff(){
  if(!resolveMonthOpen(state.year, state.month)) return 'closed';
  const lockDay = state.settings.lockDay || 15;
  const threshold = new Date(state.year, state.month-1, lockDay); threshold.setHours(0,0,0,0);
  const now = new Date(); now.setHours(0,0,0,0);
  return now.getTime() >= threshold.getTime() ? 'daylock' : null;
}
function isLockedForStaff(){ return lockReasonForStaff() !== null; }

let staffLoaded = false;

function normalizeStaff(list){
  return list.map(s => ({ gender:null, active:true, defaultByWeekday:new Array(7).fill(null), ...s }));
}
function normalizeSettings(raw){
  return { lockDay:15, monthOverrides:{}, ...(raw ? JSON.parse(raw) : {}) };
}

// スタッフ一覧と設定（月に関係なく共通）を読み込む。
// 通信に失敗したときは例外を投げる（「データが空」と取り違えて初期データで上書きしないため）。
async function fetchShared(){
  let data = await api('get', { keys:['staff-list','app-settings'] });
  if(!data.ok) throw new Error(data.error || 'load_failed');
  let staffRaw = data.values['staff-list'];
  if(staffRaw === null){
    // サーバーに本当に何も無い（初回だけ）ときに限り、初期スタッフを登録する
    const seeded = DEFAULT_STAFF_NAMES.map(name => ({id:uid(), name, gender:null, active:true, defaultByWeekday:new Array(7).fill(null)}));
    const r = await api('put', { key:'staff-list', value:JSON.stringify(seeded), adminPw:getAdminPw() });
    if(!r.ok){
      // 同時に別の端末が先に登録した場合は、そちらを読み直す
      data = await api('get', { keys:['staff-list','app-settings'] });
      if(!data.ok || data.values['staff-list'] === null) throw new Error(r.error || 'seed_failed');
      staffRaw = data.values['staff-list'];
    } else {
      staffRaw = JSON.stringify(seeded);
    }
  }
  return { staff: normalizeStaff(JSON.parse(staffRaw)), settings: normalizeSettings(data.values['app-settings']) };
}

// 指定した月のシフトと祝日設定を読み込む（失敗時は例外）
async function fetchMonth(y, m){
  const mk = monthKey(y, m);
  const data = await api('get', { keys:['shifts-'+mk, 'holidays-'+mk] });
  if(!data.ok) throw new Error(data.error || 'load_failed');
  const sRaw = data.values['shifts-'+mk], hRaw = data.values['holidays-'+mk];
  return { shifts: sRaw ? JSON.parse(sRaw) : {}, holidays: hRaw ? JSON.parse(hRaw) : {} };
}

let lastLoadedAt = 0;
async function loadAll(y, m){
  const [shared, month] = await Promise.all([fetchShared(), fetchMonth(y, m)]);
  state.staff = shared.staff;
  state.settings = shared.settings;
  state.shifts = month.shifts;
  state.holidays = month.holidays;
  state.year = y; state.month = m;
  staffLoaded = true;
  lastLoadedAt = Date.now();
  if(y===today.getFullYear() && m===today.getMonth()+1) state.timelineDay = today.getDate();
  else state.timelineDay = 1;
}

// 手動の「更新」: 成功したときだけ画面のデータを入れ替える（失敗しても今の表示は消さない）
async function refreshFromServer(){
  try{
    const [shared, month] = await Promise.all([fetchShared(), fetchMonth(state.year, state.month)]);
    state.staff = shared.staff; state.settings = shared.settings;
    state.shifts = month.shifts; state.holidays = month.holidays;
    lastLoadedAt = Date.now();
    return true;
  }catch(e){
    if(e instanceof AuthError){ handleAuthLost(); return false; }
    showAlertModal('最新のデータを読み込めませんでした。通信状態をご確認ください。\n（今表示しているデータはそのままです）');
    return false;
  }
}

// Effective shift for a given day+staff: an explicit entry (including an explicit
// "off", stored as null) always wins. If the day has never been touched at all,
// fall back live to the staff's recurring weekday pattern — this is computed fresh
// every time (never written to storage), so changing a default pattern instantly
// applies to every month that hasn't been explicitly edited, with no stale copies.
function effectiveShift(year, month, day, staffId){
  const dayObj = state.shifts[String(day)];
  if(dayObj && (staffId in dayObj)) return dayObj[staffId];
  const st = state.staff.find(s=>s.id===staffId);
  const dow = new Date(year, month-1, Number(day)).getDay();
  const pattern = st && st.defaultByWeekday && st.defaultByWeekday[dow];
  return pattern ? { start: pattern[0], end: pattern[1] } : null;
}

/* ---------------- 保存（サーバーへの書き込み） ---------------- */
let lastSaveError = null;

// 書き込みリクエストを送る。成功したら応答データ、失敗したら null（理由は lastSaveError に残す）
async function writeCall(action, payload){
  try{
    const d = await api(action, payload);
    if(d.ok){ lastSaveError = null; return d; }
    lastSaveError = d.error || 'failed';
    return null;
  }catch(e){
    if(e instanceof AuthError){ lastSaveError = 'unauthorized'; handleAuthLost(); return null; }
    lastSaveError = 'network';
    return null;
  }
}

async function saveStaff(){
  return !!(await writeCall('put', { key:'staff-list', value:JSON.stringify(state.staff), adminPw:getAdminPw() }));
}
async function saveSettings(){
  return !!(await writeCall('put', { key:'app-settings', value:JSON.stringify(state.settings), adminPw:getAdminPw() }));
}
async function saveHolidays(){
  return !!(await writeCall('put', { key:'holidays-'+monthKey(state.year,state.month), value:JSON.stringify(state.holidays), adminPw:getAdminPw() }));
}
// シフトは「1マス」だけをサーバーに送り、サーバー側で他の人の入力と合体させる
// （同時に別の人が入力しても、お互いの入力を消さないため）
async function saveShiftCell(day, staffId, value){
  const d = await writeCall('setShift', { month:monthKey(state.year,state.month), day:Number(day), staffId, value, adminPw:getAdminPw() });
  if(!d) return false;
  if(d.shifts) state.shifts = d.shifts;
  return true;
}
// 基本シフトだけを更新（他の人のスタッフ情報を上書きしない）
async function saveStaffDefaults(staffId, pattern){
  const d = await writeCall('patchStaff', { id:staffId, fields:{ defaultByWeekday: pattern } });
  if(!d) return false;
  if(d.staff) state.staff = normalizeStaff(d.staff);
  return true;
}
function saveRole(){ lsSet('shift-role', state.role); return true; }

// 入店コードが違う（変更された）と分かったとき
function handleAuthLost(){
  lsRemove('shift-access-code');
  closeModal();
  renderAccessGate('入店コードが変更されたか、正しくありません。もう一度入力してください。');
}

/* ---------------- derived info ---------------- */
function dayInfo(day){
  const dt = new Date(state.year, state.month-1, day);
  const dow = dt.getDay();
  const nationalName = isNationalHoliday(state.year, state.month, day);
  const manual = state.holidays[String(day)];
  const isHoliday = manual !== undefined ? manual : !!nationalName;
  const isWeekend = (dow===0 || dow===6);
  return { dow, isHoliday, isWeekend };
}
function rowClass(info){
  if(info.dow===6 && !info.isHoliday) return 'sat';
  if(info.dow===0 || info.isHoliday) return 'sun';
  return '';
}
function countKind(day, kind){
  let c = 0;
  activeStaff().forEach(st=>{ if(classify(effectiveShift(state.year, state.month, day, st.id)) === kind) c++; });
  return c;
}

  const isAdmin = state.role === 'admin';
  const locked = isLockedForStaff();

  let html = '';
  html += `<div class="topbar">
    <div class="brand"><span class="leaf">🌿</span><div>
      <h1 class="heading-font">シフト管理</h1>
      <div class="sub">スタッフ全員で共有されています</div>
    </div></div>
    <div class="role-area">
      <button class="gear" id="refreshBtn" style="font-size:10.5px; opacity:.7;" title="他の端末での変更を取り込む">🔄更新</button>
      <select class="role-select" id="roleSelect">
        <option value="staff" ${!isAdmin?'selected':''}>スタッフ表示</option>
        <option value="admin" ${isAdmin?'selected':''}>管理者表示</option>
      </select>
      <span class="admin-pill ${isAdmin?'show':''}">管理者</span>
      ${isAdmin? `<button class="gear" id="changePwBtn" style="font-size:10.5px; opacity:.7;">🔑管理者コード変更</button>` : ''}
      ${isAdmin? `<button class="gear" id="accessCodeBtn" style="font-size:10.5px; opacity:.7;">🔐入店コード変更</button>` : ''}
      ${isAdmin? `<button class="gear" id="staffMgmtBtn" style="font-size:10.5px; opacity:.7;">👥スタッフ管理</button>` : ''}
      ${isAdmin? `<button class="gear" id="monthSettingsBtn" style="font-size:10.5px; opacity:.7;">📅月の公開設定</button>` : ''}
    </div>
  </div>`;

  html += `<div class="tabs">
    <button id="tabTable" class="${state.view==='table'?'active':''}">📋 シフト表</button>
    <button id="tabTimeline" class="${state.view==='timeline'?'active':''}">📈 タイムライン</button>
  </div>`;

  const lockReason = lockReasonForStaff();
  if(lockReason){
    const msg = lockReason==='closed'
      ? `🔒 この月はまだ公開されていないため、シフトの入力はできません。${isAdmin? '（管理者表示のため編集できます。「📅月の公開設定」から早めに開放できます）':'公開時期については管理者にご確認ください。'}`
      : `🔒 ${state.settings.lockDay||15}日を過ぎたため、シフトの変更は管理者のみ行えます。${isAdmin? '（管理者表示のため編集できます）':''}`;
    html += `<div class="lock-note show">${msg}</div>`;
  }

  html += state.view === 'table' ? renderTableView(isAdmin, locked) : renderTimelineView();

  app.innerHTML = html;
  attachCommonEvents();
  if(state.view === 'table') attachTableEvents(isAdmin, locked); else attachTimelineEvents();
}

/* ================= TABLE VIEW ================= */
function renderTableView(isAdmin, locked){
  const y=state.year, m=state.month, nDays = daysInMonth(y,m);
  const canEdit = isAdmin || !locked;
  const staffList = activeStaff();

  let html = `<div class="month-nav-row">
    <div class="month-nav" style="margin-bottom:10px;">
      <button id="prevMonth">‹</button>
      <div class="label heading-font">${y}年${m}月</div>
      <button id="nextMonth">›</button>
    </div>
    ${isAdmin? `<button id="printBtn" class="print-btn">🖨️ 印刷（A3）</button>` : ''}
  </div>
  <div class="print-title">${y}年${m}月 シフト表</div>`;

  html += `<div class="legend">
    <span><span class="swatch" style="background:var(--saturday)"></span>土曜</span>
    <span><span class="swatch" style="background:var(--sunday)"></span>日曜・祝日</span>
    <span><span class="swatch" style="background:var(--warning-bg);border-color:#ecc7c1"></span>合計人数が基準未満（平日7人／土日祝9人）</span>
  </div>`;

  html += `<div class="table-wrap"><table><thead><tr>
    <th class="frozen" style="min-width:74px;">日付 / 人数</th>`;
  staffList.forEach(st=>{
    html += `<th style="min-width:56px;"><div class="staff-head">
      <span><span class="gender-dot ${st.gender||''}"></span> ${escapeHtml(st.name)}</span>
      <button class="gear wd-gear" data-staffid="${st.id}" title="基本シフト設定">⚙基本</button>
    </div></th>`;
  });
  html += `</tr></thead><tbody>`;

  for(let d=1; d<=nDays; d++){
    const info = dayInfo(d);
    const rc = rowClass(info);
    const total = countKind(d,'early')+countKind(d,'mid')+countKind(d,'late');
    const threshold = (info.isWeekend || info.isHoliday) ? 9 : 7;
    const warn = total < threshold;

    html += `<tr class="${rc}">
      <td class="frozen col-date">
        <div class="dline">${m}/${d}<span class="dow-tag">(${WEEKDAY_LABEL[info.dow]})</span>
          <button class="holiday-toggle ${info.isHoliday?'active':''}" data-day="${d}" ${isAdmin? '' : 'disabled'}>祝</button>
        </div>
        <div class="total-num ${warn?'warn':''}">${total}人</div>
        <div class="breakdown">早${countKind(d,'early')} 中${countKind(d,'mid')} 遅${countKind(d,'late')}</div>
      </td>`;
    staffList.forEach(st=>{
      const shift = effectiveShift(state.year, state.month, d, st.id);
      const kind = classify(shift);
      let label = '休';
      if(shift) label = shortTime(shift.start) + '-' + (shift.end==='L' ? 'L' : shortTime(shift.end));
      html += `<td class="cell"><button class="shift-btn ${kind}" data-staffid="${st.id}" data-day="${d}" ${canEdit? '' : 'disabled'}>${label}</button></td>`;
    });
    html += `</tr>`;
  }
  html += `</tbody></table></div>`;

  html += `<div class="hint">枠をタップすると出勤・退勤をプルダウンで入力できます。「⚙基本」で曜日ごとの基本シフトを設定すると、翌月以降は自動で入力されます。スタッフの追加・削除は右上の「👥スタッフ管理」（管理者表示のみ）から行えます。</div>`;
  return html;
}

function attachTableEvents(isAdmin, locked){
  const app = document.getElementById('app');
  const prev = document.getElementById('prevMonth');
  const next = document.getElementById('nextMonth');
  if(prev) prev.onclick = ()=> navigateMonth(-1);
  if(next) next.onclick = ()=> navigateMonth(1);

  app.querySelectorAll('.shift-btn').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', ()=>{
      const staffId = btn.getAttribute('data-staffid');
      const day = btn.getAttribute('data-day');
      openShiftModal(day, staffId);
    });
  });

  app.querySelectorAll('.holiday-toggle').forEach(btn=>{
    if(btn.disabled) return;
    btn.addEventListener('click', async ()=>{
      const day = btn.getAttribute('data-day');
      const info = dayInfo(Number(day));
      const prev = state.holidays[day];
      state.holidays[day] = !info.isHoliday;
      const ok = await saveHolidays();
      if(!ok){
        if(prev === undefined) delete state.holidays[day]; else state.holidays[day] = prev;
        notifySaveFailure();
        return;
      }
      render();
    });
  });

  app.querySelectorAll('.wd-gear').forEach(btn=>{
    btn.addEventListener('click', ()=> openWeekdayModal(btn.getAttribute('data-staffid')));
  });
}

/* ================= TIMELINE VIEW ================= */
function renderTimelineView(){
  const y=state.year, m=state.month, nDays=daysInMonth(y,m);
  const d = Math.min(state.timelineDay, nDays);
  const info = dayInfo(d);

  let html = `<div class="day-nav">
    <button id="prevDay">‹</button>
    <div class="label heading-font">${y}/${m}/${d} (${WEEKDAY_LABEL[info.dow]}${info.isHoliday?'・祝':''})</div>
    <button id="nextDay">›</button>
  </div>`;

  const rows = activeStaff()
    .map(st => ({ st, shift: effectiveShift(y, m, d, st.id) }))
    .filter(r => r.shift && r.shift.start)
    .map(r => ({ ...r, startMin: timeToMinutes(r.shift.start), endMin: r.shift.end==='L' ? AXIS_END : timeToMinutes(r.shift.end) }))
    .sort((a,b)=> a.startMin - b.startMin);

  html += `<div class="legend">
    <span><span class="swatch" style="background:var(--primary-dark)"></span>早番</span>
    <span><span class="swatch" style="background:var(--primary)"></span>中番</span>
    <span><span class="swatch" style="background:var(--warning)"></span>遅番（L・閉店まで）</span>
  </div>`;

  html += `<div class="timeline-wrap">`;
  if(rows.length===0){
    html += `<div class="tl-empty">この日のシフトが入力されていません。</div>`;
  } else {
    const range = AXIS_END - AXIS_START;
    rows.forEach(r=>{
      const leftPct = Math.max(0, (r.startMin - AXIS_START) / range * 100);
      const widthPct = Math.max(2, (r.endMin - r.startMin) / range * 100);
      const kind = classify(r.shift);
      html += `<div class="tl-row">
        <div class="tl-name"><span class="gender-dot ${r.st.gender||''}"></span> ${escapeHtml(r.st.name)}</div>
        <div class="tl-track">
          <div class="tl-bar ${kind}" style="left:${leftPct}%; width:${widthPct}%;">${shortTime(r.shift.start)}${r.shift.end==='L'?'-L':'-'+shortTime(r.shift.end)}</div>
        </div>
      </div>`;
    });
    // hour axis labels
    html += `<div class="tl-axis">`;
    for(let t=AXIS_START; t<AXIS_END; t+=60){ html += `<span>${Math.floor(t/60)}時</span>`; }
    html += `</div>`;

    // coverage strip (30-min slots)
    const slotMin = 30;
    const slots = [];
    for(let t=AXIS_START; t<AXIS_END; t+=slotMin){
      const count = rows.filter(r => r.startMin <= t && r.endMin > t).length;
      slots.push(count);
    }
    const maxCount = Math.max(1, ...slots);
    html += `<div class="tl-cover-wrap">`;
    slots.forEach(c=>{
      const h = Math.round((c/maxCount)*100);
      html += `<div class="tl-cover-bar ${c<=1?'low':''}" style="height:${h}%;" title="${c}人"></div>`;
    });
    html += `</div>`;
    html += `<div class="tl-cover-label">時間帯ごとの出勤人数（薄い色は手薄な時間帯の目安）</div>`;
  }
  html += `</div>`;
  html += `<div class="hint">出勤の早いスタッフから順に並んでいます。バーの帯が途切れている時間帯は人手が薄くなっています。</div>`;
  return html;
}

function attachTimelineEvents(){
  const prevDay = document.getElementById('prevDay');
  const nextDay = document.getElementById('nextDay');
  if(prevDay) prevDay.onclick = async ()=>{
    if(isNavigating) return;
    isNavigating = true;
    if(state.timelineDay > 1){ state.timelineDay--; }
    else { await changeMonth(-1, true); state.timelineDay = daysInMonth(state.year, state.month); }
    isNavigating = false;
    render();
  };
  if(nextDay) nextDay.onclick = async ()=>{
    if(isNavigating) return;
    isNavigating = true;
    const nDays = daysInMonth(state.year, state.month);
    if(state.timelineDay < nDays){ state.timelineDay++; }
    else { await changeMonth(1, true); state.timelineDay = 1; }
    isNavigating = false;
    render();
  };
}

/* ================= COMMON EVENTS ================= */
function attachCommonEvents(){
  const roleSelect = document.getElementById('roleSelect');
  if(roleSelect) roleSelect.onchange = async (e)=>{
    const chosen = e.target.value;
    if(chosen === 'admin' && state.role !== 'admin'){
      openAdminPasswordModal();
      render(); // revert the select back to staff until password is confirmed
      return;
    }
    state.role = chosen;
    await saveRole();
    render();
  };
  const changePwBtn = document.getElementById('changePwBtn');
  if(changePwBtn) changePwBtn.onclick = openChangePasswordModal;
  const accessCodeBtn = document.getElementById('accessCodeBtn');
  if(accessCodeBtn) accessCodeBtn.onclick = openChangeAccessCodeModal;
  const staffMgmtBtn = document.getElementById('staffMgmtBtn');
  if(staffMgmtBtn) staffMgmtBtn.onclick = openStaffManagementModal;
  const monthSettingsBtn = document.getElementById('monthSettingsBtn');
  if(monthSettingsBtn) monthSettingsBtn.onclick = openMonthSettingsModal;
  const refreshBtn = document.getElementById('refreshBtn');
  if(refreshBtn) refreshBtn.onclick = async ()=>{
    refreshBtn.textContent = '🔄...';
    await refreshFromServer();
    render();
  };
  const tabTable = document.getElementById('tabTable');
  const tabTimeline = document.getElementById('tabTimeline');
  if(tabTable) tabTable.onclick = ()=>{ state.view='table'; render(); };
  if(tabTimeline) tabTimeline.onclick = ()=>{ state.view='timeline'; render(); };
  const printBtn = document.getElementById('printBtn');
  if(printBtn) printBtn.onclick = ()=> window.print();
}

let isNavigating = false;
async function navigateMonth(delta){
  if(isNavigating) return; // ignore rapid double-clicks while a load is in flight
  isNavigating = true;
  await changeMonth(delta);
  isNavigating = false;
}

async function changeMonth(delta, silent){
  let m = state.month + delta, y = state.year;
  if(m<1){ m=12; y--; } else if(m>12){ m=1; y++; }
  try{
    const month = await fetchMonth(y, m);      // 読み込めたときだけ月を切り替える
    state.year = y; state.month = m;
    state.shifts = month.shifts; state.holidays = month.holidays;
    state.timelineDay = (y===today.getFullYear() && m===today.getMonth()+1) ? today.getDate() : 1;
    lastLoadedAt = Date.now();
  }catch(e){
    if(e instanceof AuthError){ handleAuthLost(); return false; }
    showAlertModal('その月のデータを読み込めませんでした。通信状態をご確認ください。');
    return false;
  }
  if(!silent) render();
  return true;
}

/* ================= MODALS ================= */
function notifySaveFailure(){
  const e = lastSaveError;
  if(e === 'locked'){
    showAlertModal('この月は現在ロックされているため、変更できません。\n変更が必要な場合は管理者にご連絡ください。');
  } else if(e === 'admin_required'){
    // 管理者パスワードが変更された等。管理者表示を解除してやり直してもらう
    lsRemove('shift-admin-pw'); state.role = 'staff'; saveRole();
    showAlertModal('この操作は管理者のみ可能です。管理者パスワードが変更された可能性があるため、スタッフ表示に戻しました。\nもう一度「管理者表示」からパスワードを入力してください。');
    render();
  } else if(e === 'too_many_attempts'){
    showAlertModal('まちがいが続いたため、しばらく操作できません。10分ほど待ってからお試しください。');
  } else {
    showAlertModal('保存に失敗しました。通信状態をご確認のうえ、もう一度お試しください。\n（入力内容はまだ反映されていません）');
  }
}
function showAlertModal(message){
  openModalHtml(`
    <h3>⚠️ お知らせ</h3>
    <div class="modal-sub" style="white-space:pre-line;">${escapeHtml(message)}</div>
    <div class="modal-actions"><button class="btn-primary" id="alertOk" style="width:100%;">OK</button></div>
  `);
  document.getElementById('alertOk').onclick = closeModal;
}
function showConfirmModal(message, onConfirm, onCancel){
  openModalHtml(`
    <h3>確認</h3>
    <div class="modal-sub" style="white-space:pre-line;">${escapeHtml(message)}</div>
    <div class="modal-actions">
      <button class="btn-cancel" id="confirmCancel">キャンセル</button>
      <button class="btn-primary" id="confirmOk">OK</button>
    </div>
  `);
  document.getElementById('confirmCancel').onclick = ()=>{ closeModal(); if(onCancel) onCancel(); };
  document.getElementById('confirmOk').onclick = ()=>{ closeModal(); onConfirm(); };
}
function closeModal(){
  const el = document.getElementById('modalOverlay');
  if(el) el.remove();
}
function openModalHtml(innerHtml){
  closeModal();
  const overlay = document.createElement('div');
  overlay.id = 'modalOverlay';
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal-panel">${innerHtml}</div>`;
  overlay.addEventListener('click', (e)=>{ if(e.target === overlay){ closeModal(); render(); } });
  document.body.appendChild(overlay);
}

function startOptionsHtml(selected){
  let h = `<option value="" ${!selected?'selected':''}>休み</option>`;
  START_OPTIONS.forEach(t=> h += `<option value="${t}" ${t===selected?'selected':''}>${t}</option>`);
  return h;
}
function endOptionsHtml(selected){
  let h = '';
  END_TIME_OPTIONS.forEach(t=> h += `<option value="${t}" ${t===selected?'selected':''}>${t}</option>`);
  h += `<option value="L" ${selected==='L'?'selected':''}>L（閉店まで）</option>`;
  return h;
}

function openShiftModal(day, staffId){
  const staff = state.staff.find(s=>s.id===staffId);
  const shift = effectiveShift(state.year, state.month, day, staffId);
  const dow = new Date(state.year, state.month-1, Number(day)).getDay();

  openModalHtml(`
    <h3>${escapeHtml(staff.name)}さんのシフト</h3>
    <div class="modal-sub">${state.month}月${day}日（${WEEKDAY_LABEL[dow]}）</div>
    <div class="modal-row">
      <div class="modal-field"><label>出勤</label>
        <select id="mStart">${startOptionsHtml(shift?shift.start:null)}</select>
      </div>
      <div class="modal-field"><label>退勤</label>
        <select id="mEnd">${endOptionsHtml(shift?shift.end:null)}</select>
      </div>
    </div>
    <label class="modal-check"><input type="checkbox" id="mAsDefault" /> ${WEEKDAY_LABEL[dow]}曜日の基本シフトとして保存する（翌月以降も自動入力）</label>
    <div class="modal-actions">
      <button class="btn-cancel" id="mCancel">キャンセル</button>
      <button class="btn-primary" id="mSave">保存</button>
    </div>
  `);

  document.getElementById('mCancel').onclick = closeModal;
  document.getElementById('mSave').onclick = async ()=>{
    const saveBtn = document.getElementById('mSave');
    const start = document.getElementById('mStart').value;
    const end = document.getElementById('mEnd').value;
    const asDefault = document.getElementById('mAsDefault').checked;
    const value = start==='' ? null : { start, end };      // null は「休み」

    saveBtn.disabled = true; saveBtn.textContent = '保存中…';
    const ok1 = await saveShiftCell(day, staffId, value);
    if(!ok1){
      saveBtn.disabled = false; saveBtn.textContent = '保存';
      notifySaveFailure();
      return; // モーダルは開いたままにして、入力内容を失わないようにする
    }

    if(asDefault){
      const s = state.staff.find(s=>s.id===staffId);
      const pattern = (s && s.defaultByWeekday ? [...s.defaultByWeekday] : new Array(7).fill(null));
      pattern[dow] = start==='' ? null : [start, end];
      const ok2 = await saveStaffDefaults(staffId, pattern);
      if(!ok2){
        // シフト自体は保存できているので、基本シフトだけ失敗したことを伝える
        closeModal(); render();
        notifySaveFailure();
        return;
      }
    }
    closeModal();
    render();
  };
}

function openWeekdayModal(staffId){
  const staff = state.staff.find(s=>s.id===staffId);
  const pattern = staff.defaultByWeekday || new Array(7).fill(null);

  let rowsHtml = '';
  for(let dow=0; dow<7; dow++){
    const p = pattern[dow];
    rowsHtml += `<div class="wd-row">
      <div class="wd-label">${WEEKDAY_LABEL[dow]}</div>
      <select data-dow="${dow}" class="wd-start">${startOptionsHtml(p?p[0]:null)}</select>
      <select data-dow="${dow}" class="wd-end">${endOptionsHtml(p?p[1]:null)}</select>
    </div>`;
  }

  openModalHtml(`
    <h3 class="weekday-modal">${escapeHtml(staff.name)}さんの基本シフト</h3>
    <div class="modal-sub">曜日ごとにいつものシフトを設定すると、翌月以降は自動で入力されます（今月にはすぐ反映されません）。</div>
    <div class="weekday-modal">${rowsHtml}</div>
    <div class="modal-actions" style="margin-top:6px;">
      <button class="btn-cancel" id="wCancel">キャンセル</button>
      <button class="btn-primary" id="wSave">保存</button>
    </div>
  `);

  document.getElementById('wCancel').onclick = closeModal;
  document.getElementById('wSave').onclick = async ()=>{
    const saveBtn = document.getElementById('wSave');
    const newPattern = new Array(7).fill(null);
    document.querySelectorAll('.wd-start').forEach(sel=>{
      const dow = Number(sel.getAttribute('data-dow'));
      const start = sel.value;
      const end = document.querySelector(`.wd-end[data-dow="${dow}"]`).value;
      newPattern[dow] = start==='' ? null : [start, end];
    });
    saveBtn.disabled = true; saveBtn.textContent = '保存中…';
    const ok = await saveStaffDefaults(staffId, newPattern);
    if(!ok){
      saveBtn.disabled = false; saveBtn.textContent = '保存';
      notifySaveFailure();
      return;
    }
    closeModal();
    render();
  };
}

function genderLabel(g){ return g==='male' ? '男性' : g==='female' ? '女性' : '未設定'; }

function openStaffManagementModal(){
  const active = state.staff.filter(s => s.active !== false);
  const retired = state.staff.filter(s => s.active === false);

  const genderSelectHtml = (st) => `
    <select class="sm-gender-select" data-staffid="${st.id}">
      <option value="" ${!st.gender?'selected':''}>未設定</option>
      <option value="male" ${st.gender==='male'?'selected':''}>男性</option>
      <option value="female" ${st.gender==='female'?'selected':''}>女性</option>
    </select>`;

  const activeListHtml = active.map((st,idx) => `
    <div class="staff-mgmt-row" data-staffid="${st.id}">
      <span class="sm-order">
        <button class="sm-move" data-staffid="${st.id}" data-dir="up" ${idx===0?'disabled':''} title="上に移動">▲</button>
        <button class="sm-move" data-staffid="${st.id}" data-dir="down" ${idx===active.length-1?'disabled':''} title="下に移動">▼</button>
      </span>
      <span class="gender-dot ${st.gender||''}"></span>
      <span class="sm-name">${escapeHtml(st.name)}</span>
      ${genderSelectHtml(st)}
      <button class="sm-retire" data-staffid="${st.id}">退職にする</button>
    </div>
  `).join('');

  const retiredListHtml = retired.map(st => `
    <div class="staff-mgmt-row" data-staffid="${st.id}">
      <span class="gender-dot ${st.gender||''}"></span>
      <span class="sm-name" style="color:var(--muted);">${escapeHtml(st.name)}</span>
      ${genderSelectHtml(st)}
      <button class="sm-reactivate" data-staffid="${st.id}">復帰させる</button>
      <button class="sm-del" data-staffid="${st.id}">完全に削除</button>
    </div>
  `).join('');

  let positionOptions = `<option value="end">末尾に追加</option>`;
  active.forEach(st => { positionOptions += `<option value="before:${st.id}">「${escapeHtml(st.name)}」さんの前</option>`; });

  openModalHtml(`
    <h3>スタッフ管理</h3>
    <div class="modal-sub">追加・退職・並び替えは管理者のみ行えます。▲▼で表の列順を入れ替えられます。「退職にする」は表から見えなくなりますが、過去のシフト記録は残ります。</div>
    <div class="staff-mgmt-list">${activeListHtml || '<div class="modal-sub" style="padding:10px;">在籍中のスタッフがいません。</div>'}</div>

    ${retired.length ? `
    <div style="margin-top:12px;">
      <div class="modal-sub" style="margin-bottom:6px;">🗂 退職済み（表には表示されません）</div>
      <div class="staff-mgmt-list">${retiredListHtml}</div>
    </div>` : ''}

    <div style="border-top:1px solid var(--border); margin:14px 0 12px; padding-top:12px;">
      <div class="modal-row">
        <div class="modal-field"><label>名前</label>
          <input type="text" id="newStaffName" placeholder="スタッフ名" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:9px; font-size:14px; font-family:inherit;" />
        </div>
        <div class="modal-field"><label>性別</label>
          <select id="newStaffGender">
            <option value="">未設定</option>
            <option value="male">男性</option>
            <option value="female">女性</option>
          </select>
        </div>
      </div>
      <div class="modal-field" style="margin-bottom:12px;"><label>追加する位置</label>
        <select id="newStaffPosition" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:9px; font-size:14px; font-family:inherit;">${positionOptions}</select>
      </div>
      <div class="modal-actions">
        <button class="btn-cancel" id="smClose">閉じる</button>
        <button class="btn-primary" id="smAdd">追加</button>
      </div>
    </div>
  `);

  document.getElementById('smClose').onclick = ()=>{ closeModal(); render(); };
  document.getElementById('smAdd').onclick = async ()=>{
    const name = document.getElementById('newStaffName').value.trim();
    if(!name) return;
    const gender = document.getElementById('newStaffGender').value || null;
    const position = document.getElementById('newStaffPosition').value;
    const newStaff = { id: uid(), name, gender, active:true, defaultByWeekday: new Array(7).fill(null) };

    const prevStaff = state.staff;
    if(position === 'end'){
      state.staff = [...state.staff, newStaff];
    } else {
      const beforeId = position.slice('before:'.length);
      const idx = state.staff.findIndex(s => s.id === beforeId);
      const arr = [...state.staff];
      arr.splice(idx < 0 ? arr.length : idx, 0, newStaff);
      state.staff = arr;
    }
    const ok = await saveStaff();
    if(!ok){
      state.staff = prevStaff;
      notifySaveFailure();
      return;
    }
    openStaffManagementModal(); // re-render the modal with the updated list
  };

  // ▲▼ reorder among active staff only (retired staff don't occupy table columns,
  // so their position in the underlying array shouldn't affect visible order).
  document.querySelectorAll('.sm-gender-select').forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const staffId = sel.getAttribute('data-staffid');
      const st = state.staff.find(s=>s.id===staffId);
      const prevGender = st.gender;
      st.gender = sel.value || null;
      const ok = await saveStaff();
      if(!ok){ st.gender = prevGender; notifySaveFailure(); return; }
      openStaffManagementModal();
    });
  });

  document.querySelectorAll('.sm-move').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const staffId = btn.getAttribute('data-staffid');
      const dir = btn.getAttribute('data-dir');
      const activeIds = state.staff.filter(s=>s.active!==false).map(s=>s.id);
      const pos = activeIds.indexOf(staffId);
      const swapPos = dir==='up' ? pos-1 : pos+1;
      if(swapPos<0 || swapPos>=activeIds.length) return;
      const idxA = state.staff.findIndex(s=>s.id===activeIds[pos]);
      const idxB = state.staff.findIndex(s=>s.id===activeIds[swapPos]);
      const prevStaff = state.staff;
      const arr = [...state.staff];
      [arr[idxA], arr[idxB]] = [arr[idxB], arr[idxA]];
      state.staff = arr;
      const ok = await saveStaff();
      if(!ok){ state.staff = prevStaff; notifySaveFailure(); return; }
      openStaffManagementModal();
    });
  });

  document.querySelectorAll('.sm-retire').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const staffId = btn.getAttribute('data-staffid');
      const st = state.staff.find(s=>s.id===staffId);
      showConfirmModal(`「${st ? st.name : ''}」さんを退職済みにします。以後、シフト表には表示されなくなります（過去の記録は残ります。あとで復帰も可能です）。よろしいですか？`, async ()=>{
        const prevStaff = state.staff;
        st.active = false;
        const ok = await saveStaff();
        if(!ok){ st.active = true; state.staff = prevStaff; notifySaveFailure(); return; }
        openStaffManagementModal();
      }, ()=> openStaffManagementModal());
    });
  });

  document.querySelectorAll('.sm-reactivate').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const staffId = btn.getAttribute('data-staffid');
      const st = state.staff.find(s=>s.id===staffId);
      st.active = true;
      const ok = await saveStaff();
      if(!ok){ st.active = false; notifySaveFailure(); return; }
      openStaffManagementModal();
    });
  });

  document.querySelectorAll('.sm-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const staffId = btn.getAttribute('data-staffid');
      const st = state.staff.find(s=>s.id===staffId);
      showConfirmModal(`「${st ? st.name : ''}」さんのデータを完全に削除します。この操作は取り消せません。よろしいですか？`, async ()=>{
        const prevStaff = state.staff;
        state.staff = state.staff.filter(s=>s.id!==staffId);
        const ok = await saveStaff();
        if(!ok){
          state.staff = prevStaff;
          notifySaveFailure();
          return;
        }
        openStaffManagementModal();
      }, ()=> openStaffManagementModal());
    });
  });
}

function monthLabel(y,m){ return `${y}年${m}月`; }

function openMonthSettingsModal(){
  const lockDay = state.settings.lockDay || 15;
  let lockDayOptions = '';
  for(let d=1; d<=31; d++) lockDayOptions += `<option value="${d}" ${d===lockDay?'selected':''}>${d}日</option>`;

  // Show the current month plus the following 5 months so admins can look ahead.
  let rows = '';
  for(let i=0; i<6; i++){
    let m = today.getMonth()+1+i, y = today.getFullYear();
    while(m>12){ m-=12; y++; }
    const mk = monthKey(y,m);
    const override = state.settings.monthOverrides[mk];
    const effectiveOpen = resolveMonthOpen(y,m);
    const isDefault = !override;
    const statusLabel = effectiveOpen ? '公開中' : '非公開';
    const basisLabel = isDefault ? '（既定）' : '（手動設定）';
    rows += `<div class="staff-mgmt-row">
      <span class="sm-name">${monthLabel(y,m)}</span>
      <span class="sm-gender" style="${effectiveOpen? 'background:#DCE6DF;color:#2B4A42;' : ''}">${statusLabel}${basisLabel}</span>
      <button class="sm-del" style="background:${effectiveOpen?'#EFEDE6':'#DCE6DF'}; border-color:${effectiveOpen?'#DCD6C9':'#3E6259'}; color:${effectiveOpen?'#8B8578':'#2B4A42'};" data-mk="${mk}" data-action="${effectiveOpen?'closed':'open'}">${effectiveOpen? '早めに閉じる' : '今すぐ公開する'}</button>
      ${!isDefault ? `<button class="sm-del" data-mk="${mk}" data-action="reset" style="background:#fff;">既定に戻す</button>` : ''}
    </div>`;
  }

  openModalHtml(`
    <h3>月の公開設定</h3>
    <div class="modal-sub">通常は「今月」と「来月」だけがスタッフ側で入力できます。それより先の月は、ここで早めに公開しない限りロックされたままになります。</div>
    <div class="modal-row" style="align-items:flex-end;">
      <div class="modal-field"><label>◯日を過ぎたら管理者のみ編集可（全月共通）</label>
        <select id="lockDaySelect">${lockDayOptions}</select>
      </div>
      <button class="btn-primary" id="lockDaySave" style="flex:0 0 auto; padding:9px 16px;">保存</button>
    </div>
    <div style="border-top:1px solid var(--border); margin:12px 0 10px; padding-top:10px;">
      <div class="modal-sub" style="margin-bottom:8px;">月ごとの公開状況</div>
      <div class="staff-mgmt-list" style="max-height:34vh;">${rows}</div>
    </div>
    <div class="modal-actions" style="margin-top:12px;">
      <button class="btn-cancel" id="msClose">閉じる</button>
    </div>
  `);

  document.getElementById('msClose').onclick = ()=>{ closeModal(); render(); };
  document.getElementById('lockDaySave').onclick = async ()=>{
    const prevLockDay = state.settings.lockDay;
    state.settings.lockDay = Number(document.getElementById('lockDaySelect').value);
    const ok = await saveSettings();
    if(!ok){ state.settings.lockDay = prevLockDay; notifySaveFailure(); return; }
    openMonthSettingsModal();
  };
  document.querySelectorAll('#modalOverlay .sm-del[data-mk]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      const mk = btn.getAttribute('data-mk');
      const action = btn.getAttribute('data-action');
      const prevOverride = state.settings.monthOverrides[mk];
      if(action === 'reset') delete state.settings.monthOverrides[mk];
      else state.settings.monthOverrides[mk] = action;
      const ok = await saveSettings();
      if(!ok){
        if(prevOverride === undefined) delete state.settings.monthOverrides[mk];
        else state.settings.monthOverrides[mk] = prevOverride;
        notifySaveFailure();
        return;
      }
      openMonthSettingsModal();
    });
  });
}

function openAdminPasswordModal(){
  openModalHtml(`
    <h3>管理者パスワード</h3>
    <div class="modal-sub">管理者表示に切り替えるには、管理者パスワードを入力してください。</div>
    <div class="modal-field" style="margin-bottom:6px;">
      <input type="password" inputmode="numeric" id="pwInput" placeholder="管理者パスワード" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:15px; font-family:inherit;" />
    </div>
    <div id="pwError" style="color:var(--warning); font-size:11.5px; min-height:16px; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="pwCancel">キャンセル</button>
      <button class="btn-primary" id="pwConfirm">確認</button>
    </div>
  `);
  document.getElementById('pwCancel').onclick = closeModal;
  const input = document.getElementById('pwInput');
  const errEl = document.getElementById('pwError');
  const btn = document.getElementById('pwConfirm');
  input.focus();
  const tryConfirm = async ()=>{
    const entered = input.value.trim();
    if(!entered) return;
    btn.disabled = true; errEl.textContent = '';
    try{
      // パスワードの照合はサーバー側で行う（画面のコードには書かれていません）
      const d = await api('verifyAdmin', { pw: entered });
      if(d.ok){
        lsSet('shift-admin-pw', entered);
        state.role = 'admin'; saveRole();
        closeModal(); render();
        return;
      }
      errEl.textContent = d.error === 'too_many_attempts' ? 'まちがいが続いたため、しばらく待ってからお試しください。' : 'パスワードが違います。';
    }catch(e){
      if(e instanceof AuthError){ handleAuthLost(); return; }
      errEl.textContent = '通信できませんでした。もう一度お試しください。';
    }
    btn.disabled = false; input.value = ''; input.focus();
  };
  btn.onclick = tryConfirm;
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryConfirm(); });
}

}

/* ================= 入店コード（アプリ全体の入口） ================= */
// 入店コードはサーバー側でも確認されます。コードが違う端末は、データの読み書きが一切できません。
// 管理者がコードを変更すると、古いコードのままの端末は次の通信から締め出されます（データは消えません）。
function renderAccessGate(message){
  document.getElementById('app').innerHTML = `
    <div class="access-gate">
      <div class="access-gate-card">
        <div style="font-size:32px;">🌿</div>
        <h2>入店コードを入力してください</h2>
        <div class="modal-sub" style="margin-bottom:14px;">お店の管理者に確認してください。</div>
        <input type="password" inputmode="numeric" id="gateInput" placeholder="コード" />
        <div id="gateError" class="gate-error">${message ? escapeHtml(message) : ''}</div>
        <button id="gateSubmit" class="btn-primary" style="width:100%; margin-top:10px;">開く</button>
      </div>
    </div>
  `;
  const input = document.getElementById('gateInput');
  const errEl = document.getElementById('gateError');
  const btn = document.getElementById('gateSubmit');
  input.focus();
  const tryUnlock = async ()=>{
    const entered = input.value.trim();
    if(!entered) return;
    btn.disabled = true; errEl.textContent = '';
    try{
      const d = await api('verify', { code: entered });
      if(d.ok){ lsSet('shift-access-code', entered); bootApp(); return; }
      errEl.textContent = d.error === 'too_many_attempts' ? 'まちがいが続いたため、しばらく待ってからお試しください。' : 'コードが違います。';
    }catch(e){
      errEl.textContent = (e instanceof AuthError) ? 'コードが違います。' : '通信できませんでした。もう一度お試しください。';
    }
    btn.disabled = false; input.value = ''; input.focus();
  };
  btn.onclick = tryUnlock;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryUnlock(); });
}

function openChangeAccessCodeModal(){
  openModalHtml(`
    <h3>入店コードの変更</h3>
    <div class="modal-sub">アプリに入るためのコードです。スタッフが辞めたときなどにここで変更すると、新しいコードを知らない人は、データの閲覧も入力もできなくなります。既存のシフトデータには影響しません。</div>
    <div class="modal-field" style="margin-bottom:6px;">
      <input type="text" inputmode="numeric" id="newAccessCodeInput" placeholder="新しいコード" style="width:100%; border:1px solid var(--border); border-radius:8px; padding:10px; font-size:15px; font-family:inherit;" />
    </div>
    <div id="newAccessCodeError" style="color:var(--warning); font-size:11.5px; min-height:16px; margin-bottom:8px;"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="acCancel">キャンセル</button>
      <button class="btn-primary" id="acSave">保存</button>
    </div>
  `);
  document.getElementById('acCancel').onclick = closeModal;
  document.getElementById('acSave').onclick = async ()=>{
    const v = document.getElementById('newAccessCodeInput').value.trim();
    if(v.length < 1){ document.getElementById('newAccessCodeError').textContent = 'コードを入力してください。'; return; }
    const d = await writeCall('setCode', { adminPw:getAdminPw(), newCode:v });
    if(!d){ notifySaveFailure(); return; }
    lsSet('shift-access-code', v);   // 管理者自身の端末は、そのまま使い続けられるようにする
    closeModal();
    showAlertModal('入店コードを変更しました。\n新しいコードを、いま働いているスタッフにだけ伝えてください。');
  };
}

/* ================= 起動・設定・エラー画面 ================= */
function renderSetupScreen(message){
  document.getElementById('app').innerHTML = `
    <div class="access-gate">
      <div class="access-gate-card" style="max-width:420px; text-align:left;">
        <div style="font-size:32px; text-align:center;">🌿</div>
        <h2 style="text-align:center;">初期設定</h2>
        <div class="modal-sub" style="margin-bottom:12px;">データの保存先（Google Apps Script の「ウェブアプリのURL」）を貼り付けてください。手順は別紙のセットアップ手順をご覧ください。</div>
        <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/…/exec" style="font-size:13px; letter-spacing:0; text-align:left;" />
        <div id="apiUrlError" class="gate-error">${message ? escapeHtml(message) : ''}</div>
        <button id="apiUrlSave" class="btn-primary" style="width:100%; margin-top:10px;">保存して開く</button>
      </div>
    </div>
  `;
  document.getElementById('apiUrlSave').onclick = ()=>{
    const v = document.getElementById('apiUrlInput').value.trim();
    if(!/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(v)){
      document.getElementById('apiUrlError').textContent = 'URLの形式が正しくありません。「…/exec」で終わるURLを貼り付けてください。';
      return;
    }
    lsSet('shift-api-url', v);
    init();
  };
}

function renderLoadError(){
  document.getElementById('app').innerHTML = `
    <div class="access-gate">
      <div class="access-gate-card">
        <div style="font-size:32px;">📡</div>
        <h2>データを読み込めませんでした</h2>
        <div class="modal-sub" style="margin-bottom:14px;">通信状態をご確認のうえ、もう一度お試しください。<br>（保存済みのデータは消えていません）</div>
        <button id="retryBtn" class="btn-primary" style="width:100%;">再試行</button>
        ${(!API_URL && lsGet('shift-api-url')) ? '<button id="resetUrlBtn" class="btn-cancel" style="width:100%; margin-top:8px;">接続先を設定し直す</button>' : ''}
      </div>
    </div>
  `;
  document.getElementById('retryBtn').onclick = bootApp;
  const reset = document.getElementById('resetUrlBtn');
  if(reset) reset.onclick = ()=>{ lsRemove('shift-api-url'); init(); };
}

async function bootApp(){
  document.getElementById('app').innerHTML = '<div class="loading">読み込み中…</div>';
  try{
    await loadAll(state.year, state.month);
    render();
    startAutoRefresh();
  }catch(e){
    if(e instanceof AuthError){ handleAuthLost(); return; }
    renderLoadError();
  }
}

// 画面に戻ってきたとき（アプリ切り替え・スリープ復帰など）、最新のデータを静かに取り込む。
// 入力中（ダイアログ表示中）は触らず、データが変わっていたときだけ画面を描き直す。
let autoRefreshStarted = false;
function startAutoRefresh(){
  if(autoRefreshStarted) return;
  autoRefreshStarted = true;
  document.addEventListener('visibilitychange', async ()=>{
    if(document.visibilityState !== 'visible') return;
    if(!staffLoaded || document.getElementById('modalOverlay')) return;
    if(Date.now() - lastLoadedAt < 30000) return;
    const y = state.year, m = state.month;
    const snapshot = () => JSON.stringify([state.staff, state.settings, state.shifts, state.holidays]);
    try{
      const [shared, month] = await Promise.all([fetchShared(), fetchMonth(y, m)]);
      if(document.getElementById('modalOverlay') || state.year !== y || state.month !== m) return;
      const before = snapshot();
      state.staff = shared.staff; state.settings = shared.settings;
      state.shifts = month.shifts; state.holidays = month.holidays;
      lastLoadedAt = Date.now();
      if(snapshot() !== before) render();
    }catch(e){
      if(e instanceof AuthError) handleAuthLost();   // 通信エラーのときは何もしない（今の表示を保つ）
    }
  });
}

async function init(){
  // 共有リンクに ?api=… が付いていたら、この端末に接続先を登録してアドレスから消す
  try{
    const p = new URLSearchParams(location.search).get('api');
    if(p && /^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(p)){
      lsSet('shift-api-url', p);
      history.replaceState(null, '', location.pathname);
    }
  }catch(e){}
  if(!getApiUrl()){ renderSetupScreen(); return; }
  if(!getStoredCode()){ renderAccessGate(); return; }
  await bootApp();
}
init();
</script>
